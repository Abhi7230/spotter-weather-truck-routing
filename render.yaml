# Render Blueprint: one Docker web service (Django API + React build) and a free
# Postgres database. Deploy with "New > Blueprint" and point it at this repo.
services:
  - type: web
    name: spotter-weather-routing
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: spotter-weather-routing-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: spotter-weather-routing-db
    plan: free
